# Configuración de Bitcoin Core - Testnet4
# Red
testnet4=1

# Servidor RPC
server=1
daemon=0
maxtfee=0.0001
listenonion=1

# Modo prune (poda) para moderar el espacio de almacenamiento
# 550 MiB propuesto para este proyecto
prune=550

[testnet4]
# RPC para LND (accesible en la red Docker lnbits_network)
rpcuser=__BITCOIN_RPC_USER__
rpcpassword=__BITCOIN_RPC_PASSWORD__
rpcallowip=172.28.0.0/16
rpcbind=0.0.0.0
rpcport=18332
rpcworkqueue=32
rpcthreads=16

# ZMQ para notificaciones rápidas (accesible en la red Docker)
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
maxmempool=300
