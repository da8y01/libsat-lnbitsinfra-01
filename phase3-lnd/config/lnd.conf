[Application Options]
alias=__LND_ALIAS__
listen=0.0.0.0:9735
#listen=localhost
externalip=127.0.0.1:9735
restlisten=0.0.0.0:8080
rpclisten=0.0.0.0:10009
allow-circular-route=1

tor.active=1
tor.v3=1
tor.socks=base:9050
tor.control=base:9051
tor.password=__TOR_PASSWORD__
tor.skip-proxy-for-clearnet-targets=true

[Bitcoin]
bitcoin.active=true
bitcoin.testnet4=1
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=bitcoind:18332
bitcoind.rpcuser=__BITCOIN_RPC_USER__
bitcoind.rpcpass=__BITCOIN_RPC_PASSWORD__
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333
